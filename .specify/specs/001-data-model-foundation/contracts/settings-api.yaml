openapi: "3.0.3"

info:
  title: RFP Automator — Settings API (Structured Proposal Bid Engine)
  version: "1.0.0"
  description: |
    Organization-scoped settings routes for the Structured Proposal Bid Engine feature.
    All routes require an authenticated Clerk session. The organization identifier is
    derived server-side from the session (`auth().orgId`) — callers never pass it
    explicitly. Admin-only routes are noted per-operation.

    **Tenant isolation**: Every read and write is scoped to the authenticated
    organization. A 403 is returned when the resolved org context does not own the
    requested resource.

    **Upsert semantics on PATCH**: All PATCH operations create the record if it does
    not yet exist. Omitting a field in the request body leaves it unchanged.

    **Error envelope**: All error responses use the shape
    `{ "success": false, "error": "<message>" }`. Validation failures (422) additionally
    carry a `fields` map of per-field error arrays.

servers:
  - url: /api
    description: Next.js App Router API prefix (relative to origin)

tags:
  - name: Rate Card
    description: Organization pricing configuration — roles, rates, margin, discounts.
  - name: Company Profile
    description: Free-text supplier description used as proposal context.
  - name: Proposal Templates
    description: Verbatim contract clause library scoped to an organization.

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - ClerkSession: []

components:
  securitySchemes:
    ClerkSession:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token (httpOnly cookie handled by Clerk middleware)
      description: |
        Authentication is enforced by Clerk middleware on every route under `/api/settings/`.
        The Bearer token is a Clerk session token. In practice, the browser sends the
        session cookie automatically; this scheme documents the server expectation.

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # --- Envelope types ---

    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
      description: Minimal success response with no data payload (used by DELETE).

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable error description. Never contains internal stack traces.
      example:
        success: false
        error: "Template not found or does not belong to this organization"

    ValidationErrorEnvelope:
      type: object
      required: [success, error, fields]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          example: "Validation failed"
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |
            Map of field path to list of error messages for that field.
            Field paths use dot notation for nested fields (e.g. `roles[0].rate`).
          example:
            defaultMarginPct: ["Must be between 0.0 and 1.0"]
            "roles[0].rate": ["Must be a positive number"]

    # --- Rate Card domain types ---

    PricingUnit:
      type: string
      enum: [hour, day, fixed]
      description: The unit of measurement that the rate applies to.

    DiscountType:
      type: string
      enum: [percentage, fixed]
      description: |
        `percentage` — value is a fraction of the base amount (0.0–1.0).
        `fixed` — value is a flat USD deduction.

    DiscountAppliesTo:
      type: string
      enum: [subtotal, total]
      description: The amount the discount is applied against.

    PricingModel:
      type: string
      enum: [time_and_materials, fixed_price, cost_plus]
      description: Default contract pricing model for proposals from this organization.

    RateCardMode:
      type: string
      enum: [blended, by_role]
      description: |
        `blended` — a single hourly rate covers all labor.
        `by_role` — each named role carries its own rate.

    Role:
      type: object
      required: [name, unit, rate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name of the role (e.g. "Senior Engineer").
          example: "Senior Engineer"
        unit:
          $ref: "#/components/schemas/PricingUnit"
        rate:
          type: number
          format: double
          minimum: 0.01
          description: |
            Rate in USD. Must be a positive number greater than zero.
            Stored with precision sufficient to represent cents accurately.
          example: 195.00
      example:
        name: "Senior Engineer"
        unit: "hour"
        rate: 195.00

    DiscountRule:
      type: object
      required: [name, type, value, appliesTo]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name of the discount rule.
          example: "Volume discount"
        type:
          $ref: "#/components/schemas/DiscountType"
        value:
          type: number
          format: double
          minimum: 0.01
          description: |
            Numeric discount magnitude. Must be positive.
            When `type` is `percentage`, must not exceed 1.0 (i.e. 100%).
            When `type` is `fixed`, the value is a USD amount.
          example: 0.10
        appliesTo:
          $ref: "#/components/schemas/DiscountAppliesTo"
        customerIds:
          type: array
          items:
            type: string
          nullable: true
          description: |
            Restrict this discount to the listed customer identifiers.
            `null` means the discount applies to all customers.
          example: null
      example:
        name: "Volume discount"
        type: "percentage"
        value: 0.10
        appliesTo: "subtotal"
        customerIds: null

    ProposalDefaults:
      type: object
      description: |
        Default contract terms stored alongside the rate card.
        All fields are optional on PATCH; omitted fields retain their current values.
      properties:
        pricingModel:
          $ref: "#/components/schemas/PricingModel"
        paymentTermsDays:
          type: integer
          minimum: 0
          description: Number of days after invoice for payment (e.g. 30 = Net 30).
          example: 30
        warrantyPeriodDays:
          type: integer
          minimum: 0
          description: Warranty period in days following project delivery.
          example: 90
      example:
        pricingModel: "time_and_materials"
        paymentTermsDays: 30
        warrantyPeriodDays: 90

    RateCard:
      type: object
      description: |
        Complete pricing configuration for an organization.

        **Validation rules**:
        - `defaultMarginPct` must be in the range [0.0, 1.0].
        - All `roles[*].rate` values must be positive (> 0).
        - When `mode` is `blended`, `blendedRate` is required and must be positive.
        - When `mode` is `by_role`, `roles` must contain at least one entry.
        - Each `discounts[*].value` must be positive.
        - When `discounts[*].type` is `percentage`, `discounts[*].value` must be ≤ 1.0.
      required: [mode, defaultMarginPct, currency]
      properties:
        mode:
          $ref: "#/components/schemas/RateCardMode"
        blendedRate:
          type: number
          format: double
          minimum: 0.01
          nullable: true
          description: |
            Single blended rate in USD. Required when `mode` is `blended`.
            Must be positive when provided.
          example: 150.00
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: |
            Role-specific rates. Required to have at least one entry when `mode`
            is `by_role`. May be empty or omitted when `mode` is `blended`.
          example:
            - name: "Senior Engineer"
              unit: "hour"
              rate: 195.00
            - name: "Project Manager"
              unit: "day"
              rate: 1200.00
        defaultMarginPct:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: |
            Default gross margin applied to labor costs before presenting to the customer.
            Expressed as a decimal fraction: 0.20 = 20%, 0.0 = no margin.
          example: 0.20
        currency:
          type: string
          enum: [USD]
          description: Currency code for all monetary values in this rate card. Only USD is supported in v1.
          example: "USD"
        discounts:
          type: array
          items:
            $ref: "#/components/schemas/DiscountRule"
          description: Ordered list of discount rules. An empty array means no discounts configured.
          example: []
      example:
        mode: "by_role"
        blendedRate: null
        roles:
          - name: "Senior Engineer"
            unit: "hour"
            rate: 195.00
          - name: "Project Manager"
            unit: "day"
            rate: 1200.00
        defaultMarginPct: 0.20
        currency: "USD"
        discounts:
          - name: "Volume discount"
            type: "percentage"
            value: 0.10
            appliesTo: "subtotal"
            customerIds: null

    RateCardResponse:
      type: object
      description: Response envelope for rate card read operations.
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          nullable: true
          description: |
            `null` when the organization has not yet configured a rate card.
          properties:
            rateCard:
              $ref: "#/components/schemas/RateCard"
              nullable: true
            proposalDefaults:
              $ref: "#/components/schemas/ProposalDefaults"
              nullable: true
          example:
            rateCard:
              mode: "by_role"
              blendedRate: null
              roles:
                - name: "Senior Engineer"
                  unit: "hour"
                  rate: 195.00
              defaultMarginPct: 0.20
              currency: "USD"
              discounts: []
            proposalDefaults:
              pricingModel: "time_and_materials"
              paymentTermsDays: 30
              warrantyPeriodDays: 90
      example:
        success: true
        data:
          rateCard:
            mode: "by_role"
            blendedRate: null
            roles:
              - name: "Senior Engineer"
                unit: "hour"
                rate: 195.00
            defaultMarginPct: 0.20
            currency: "USD"
            discounts: []
          proposalDefaults:
            pricingModel: "time_and_materials"
            paymentTermsDays: 30
            warrantyPeriodDays: 90

    RateCardPatchRequest:
      type: object
      description: |
        Partial update for rate card and/or proposal defaults. All top-level fields are
        optional. Omitting `rateCard` leaves the existing rate card unchanged. Omitting
        `proposalDefaults` leaves existing defaults unchanged. Within each object,
        individual fields may also be omitted — only provided fields are updated.

        **Cross-field validation** (applied only to fields present in the request):
        - If `rateCard.mode` is `blended`, `rateCard.blendedRate` must be provided and positive.
        - If `rateCard.mode` is `by_role`, `rateCard.roles` must have at least one entry.
        - `rateCard.defaultMarginPct` must be in [0.0, 1.0].
        - All `rateCard.roles[*].rate` must be positive.
        - All `rateCard.discounts[*].value` must be positive; percentage type must be ≤ 1.0.
      properties:
        rateCard:
          type: object
          description: Partial rate card fields to update.
          properties:
            mode:
              $ref: "#/components/schemas/RateCardMode"
            blendedRate:
              type: number
              format: double
              minimum: 0.01
              nullable: true
            roles:
              type: array
              items:
                $ref: "#/components/schemas/Role"
            defaultMarginPct:
              type: number
              format: double
              minimum: 0.0
              maximum: 1.0
            currency:
              type: string
              enum: [USD]
            discounts:
              type: array
              items:
                $ref: "#/components/schemas/DiscountRule"
        proposalDefaults:
          type: object
          description: Partial proposal defaults to update.
          properties:
            pricingModel:
              $ref: "#/components/schemas/PricingModel"
            paymentTermsDays:
              type: integer
              minimum: 0
            warrantyPeriodDays:
              type: integer
              minimum: 0
      example:
        rateCard:
          mode: "blended"
          blendedRate: 150.00
          defaultMarginPct: 0.20
          currency: "USD"
          discounts: []
        proposalDefaults:
          pricingModel: "fixed_price"
          paymentTermsDays: 45
          warrantyPeriodDays: 60

    # --- Company Profile domain types ---

    CompanyProfile:
      type: object
      description: Free-text supplier description stored per organization.
      required: [profileText]
      properties:
        profileText:
          type: string
          description: |
            Markdown-formatted supplier description. Minimum 1 character when present.
            No maximum enforced by the API below 50,000 characters.
            Unicode characters (multi-byte, em-dashes, smart quotes) are stored verbatim.
          example: |
            ## Acme Solutions

            We deliver **enterprise-grade** software for regulated industries.

            - 20 years of experience
            - ISO 27001 certified
            - Offices in New York, London, and Singapore
      example:
        profileText: "## Acme Solutions\n\nWe deliver **enterprise-grade** software for regulated industries."

    CompanyProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          nullable: true
          description: |
            `null` when the organization has not yet saved a company profile.
          properties:
            profileText:
              type: string
              nullable: true
              description: The stored markdown text, or `null` if not yet configured.
      example:
        success: true
        data:
          profileText: "## Acme Solutions\n\nWe deliver enterprise-grade software."

    CompanyProfilePatchRequest:
      type: object
      required: [profileText]
      properties:
        profileText:
          type: string
          minLength: 1
          description: |
            Full replacement text for the company profile. Must be at least 1 character.
            Send an empty string to clear — but the server interprets an empty string as
            a request to unset the profile (stored as null). The minimum length of 1
            applies when the intent is to save a non-empty profile.
      example:
        profileText: "## Acme Solutions\n\nWe deliver enterprise-grade software."

    # --- Proposal Template domain types ---

    TemplateSection:
      type: string
      enum:
        - assumptions
        - exclusions
        - payment_terms
        - change_management
        - ip_ownership
        - liability
        - force_majeure
        - warranty
      description: Classifies which section of a proposal the template clause belongs to.

    ProposalTemplate:
      type: object
      description: A single verbatim contract clause belonging to an organization's template library.
      required:
        - id
        - organizationId
        - section
        - title
        - content
        - isRequired
        - evaluateCoverage
        - sortOrder
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this template.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        organizationId:
          type: string
          description: Clerk organization ID of the owning organization.
          example: "org_2abc123def456"
        section:
          $ref: "#/components/schemas/TemplateSection"
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Short display title for the template clause.
          example: "Standard Payment Terms"
        content:
          type: string
          minLength: 1
          description: |
            Verbatim markdown clause content. Injected character-for-character into
            proposals. Minimum 1 character. No practical upper bound below 50,000
            characters. Unicode is preserved exactly.
          example: "Payment is due **Net 30** from the date of invoice."
        isRequired:
          type: boolean
          description: |
            When `true`, this clause is always included in every proposal.
            **Constraint**: when `isRequired` is `true`, `evaluateCoverage` is always
            `false` — enforced at the data layer regardless of what is submitted.
          example: false
        triggerRfpTypes:
          type: array
          items:
            type: string
          nullable: true
          description: |
            Include this clause only when the RFP type matches one of these values.
            `null` means the clause applies to all RFP types (universal situational clause).
          example: ["technical", "compliance"]
        triggerIndustryTags:
          type: array
          items:
            type: string
          nullable: true
          description: |
            Include this clause only when the RFP industry tag matches one of these values.
            `null` means the clause applies to all industry tags.
          example: null
        evaluateCoverage:
          type: boolean
          description: |
            When `true`, the coverage checker will assess whether the proposal content
            addresses the intent of this clause. Always `false` when `isRequired` is `true`.
          example: true
        sortOrder:
          type: integer
          minimum: 0
          description: |
            Non-negative integer controlling display and injection order within a section.
            Templates are returned in ascending `sortOrder` within the section. Gaps in
            sort order values are allowed (e.g. 1, 3, 5 is valid).
          example: 10
        createdBy:
          type: string
          description: Clerk user ID of the user who created this template.
          example: "user_2xyz789abc"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of creation.
          example: "2026-02-25T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of last modification.
          example: "2026-02-25T15:00:00Z"
      example:
        id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        organizationId: "org_2abc123def456"
        section: "payment_terms"
        title: "Standard Payment Terms"
        content: "Payment is due **Net 30** from the date of invoice."
        isRequired: false
        triggerRfpTypes: null
        triggerIndustryTags: null
        evaluateCoverage: true
        sortOrder: 10
        createdBy: "user_2xyz789abc"
        createdAt: "2026-02-25T14:30:00Z"
        updatedAt: "2026-02-25T14:30:00Z"

    ProposalTemplateListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [templates]
          properties:
            templates:
              type: array
              items:
                $ref: "#/components/schemas/ProposalTemplate"
              description: |
                Templates belonging to the authenticated organization, ordered by
                `sortOrder` ascending. An empty array is returned when no templates
                have been created.
      example:
        success: true
        data:
          templates:
            - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              organizationId: "org_2abc123def456"
              section: "payment_terms"
              title: "Standard Payment Terms"
              content: "Payment is due **Net 30** from the date of invoice."
              isRequired: false
              triggerRfpTypes: null
              triggerIndustryTags: null
              evaluateCoverage: true
              sortOrder: 10
              createdBy: "user_2xyz789abc"
              createdAt: "2026-02-25T14:30:00Z"
              updatedAt: "2026-02-25T14:30:00Z"

    ProposalTemplateSingleResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [template]
          properties:
            template:
              $ref: "#/components/schemas/ProposalTemplate"
      example:
        success: true
        data:
          template:
            id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            organizationId: "org_2abc123def456"
            section: "payment_terms"
            title: "Standard Payment Terms"
            content: "Payment is due **Net 30** from the date of invoice."
            isRequired: false
            triggerRfpTypes: null
            triggerIndustryTags: null
            evaluateCoverage: true
            sortOrder: 10
            createdBy: "user_2xyz789abc"
            createdAt: "2026-02-25T14:30:00Z"
            updatedAt: "2026-02-25T14:30:00Z"

    ProposalTemplateCreateRequest:
      type: object
      required: [section, title, content, isRequired, sortOrder]
      description: |
        Fields required to create a new proposal template. The server assigns `id`,
        `organizationId`, `createdBy`, `createdAt`, and `updatedAt`.

        **Constraint**: If `isRequired` is `true`, any `evaluateCoverage` value
        submitted is ignored and stored as `false`.
      properties:
        section:
          $ref: "#/components/schemas/TemplateSection"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Force Majeure Clause"
        content:
          type: string
          minLength: 1
          description: Verbatim markdown clause content. Minimum 1 character.
          example: "Neither party shall be liable for delays caused by events beyond reasonable control..."
        isRequired:
          type: boolean
          example: true
        triggerRfpTypes:
          type: array
          items:
            type: string
          nullable: true
          default: null
          example: null
        triggerIndustryTags:
          type: array
          items:
            type: string
          nullable: true
          default: null
          example: null
        evaluateCoverage:
          type: boolean
          default: false
          description: |
            Ignored and set to `false` server-side when `isRequired` is `true`.
          example: false
        sortOrder:
          type: integer
          minimum: 0
          description: Non-negative integer. Gaps between values are permitted.
          example: 20
      example:
        section: "force_majeure"
        title: "Force Majeure Clause"
        content: "Neither party shall be liable for delays caused by events beyond reasonable control..."
        isRequired: true
        triggerRfpTypes: null
        triggerIndustryTags: null
        evaluateCoverage: false
        sortOrder: 20

    ProposalTemplatePatchRequest:
      type: object
      description: |
        Partial update for an existing proposal template. All fields are optional.
        Omitted fields retain their current values.

        **Constraint**: If `isRequired` is set to `true` (either in this request or
        already stored), `evaluateCoverage` is coerced to `false` server-side.
      properties:
        section:
          $ref: "#/components/schemas/TemplateSection"
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        isRequired:
          type: boolean
        triggerRfpTypes:
          type: array
          items:
            type: string
          nullable: true
        triggerIndustryTags:
          type: array
          items:
            type: string
          nullable: true
        evaluateCoverage:
          type: boolean
          description: Ignored and stored as `false` whenever `isRequired` is `true`.
        sortOrder:
          type: integer
          minimum: 0
      example:
        title: "Updated Payment Terms"
        paymentTermsDays: 45
        sortOrder: 5

    ReorderItem:
      type: object
      required: [id, sortOrder]
      properties:
        id:
          type: string
          format: uuid
          description: Template identifier to reorder.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        sortOrder:
          type: integer
          minimum: 0
          description: New sort order value for this template. Must be a non-negative integer.
          example: 5

    ReorderRequest:
      type: object
      required: [items]
      description: |
        Bulk sort order update. All referenced template IDs must belong to the
        authenticated organization. Any template ID not owned by the org is rejected
        with 422.
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReorderItem"
          description: |
            List of template IDs with their new sort order values. Partial lists are
            accepted — only the listed templates have their sort order updated. Unlisted
            templates retain their existing sort order.
      example:
        items:
          - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            sortOrder: 1
          - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
            sortOrder: 2
          - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
            sortOrder: 3

    ReorderResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [updated]
          properties:
            updated:
              type: integer
              description: Number of template records whose sort order was modified.
              example: 3
      example:
        success: true
        data:
          updated: 3

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:

    Unauthorized:
      description: |
        No valid Clerk session. The request is missing an authentication token or
        the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Unauthorized"

    Forbidden:
      description: |
        The authenticated user's organization does not own the requested resource.
        This is returned when a user attempts to read or modify another organization's
        data — tenant isolation prevents access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Access denied"

    NotFound:
      description: |
        The requested resource ID does not exist, or it exists but is not owned by
        the authenticated organization (intentionally indistinguishable to callers).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Template not found or does not belong to this organization"

    UnprocessableEntity:
      description: |
        The request body is structurally valid JSON but fails business validation.
        The `fields` map identifies which fields failed and why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          example:
            success: false
            error: "Validation failed"
            fields:
              defaultMarginPct: ["Must be between 0.0 and 1.0"]
              "roles[0].rate": ["Must be a positive number"]

    InternalServerError:
      description: |
        An unexpected server-side error occurred. No internal details are included
        in the response body. Consult server logs (correlated by request ID) for
        diagnosis.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Internal server error"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # =========================================================================
  # Rate Card
  # =========================================================================

  /settings/rate-card:

    get:
      operationId: getRateCard
      summary: Retrieve organization rate card and proposal defaults
      description: |
        Returns the authenticated organization's rate card configuration and proposal
        defaults. When no rate card has been saved yet, `data` is `null`. Accessible
        by any authenticated organization member.
      tags: [Rate Card]
      responses:
        "200":
          description: Rate card retrieved successfully. `data` is `null` when unconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCardResponse"
              examples:
                configured:
                  summary: Organization with a rate card configured
                  value:
                    success: true
                    data:
                      rateCard:
                        mode: "by_role"
                        blendedRate: null
                        roles:
                          - name: "Senior Engineer"
                            unit: "hour"
                            rate: 195.00
                          - name: "Project Manager"
                            unit: "day"
                            rate: 1200.00
                        defaultMarginPct: 0.20
                        currency: "USD"
                        discounts:
                          - name: "Volume discount"
                            type: "percentage"
                            value: 0.10
                            appliesTo: "subtotal"
                            customerIds: null
                      proposalDefaults:
                        pricingModel: "time_and_materials"
                        paymentTermsDays: 30
                        warrantyPeriodDays: 90
                unconfigured:
                  summary: Organization with no rate card saved yet
                  value:
                    success: true
                    data: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: upsertRateCard
      summary: Upsert organization rate card and proposal defaults
      description: |
        Creates or updates the authenticated organization's rate card. This is an upsert
        — if no rate card exists, one is created; if one exists, only the supplied fields
        are updated. Requires admin role within the organization.

        **Validation** (applied to any field present in the request body):
        - `rateCard.defaultMarginPct` must be in [0.0, 1.0].
        - `rateCard.roles[*].rate` must be positive (> 0).
        - When `rateCard.mode` is `blended`, `rateCard.blendedRate` must be provided
          and positive.
        - When `rateCard.mode` is `by_role`, `rateCard.roles` must have at least one entry.
        - `rateCard.discounts[*].value` must be positive.
        - When `rateCard.discounts[*].type` is `percentage`,
          `rateCard.discounts[*].value` must be ≤ 1.0.
      tags: [Rate Card]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateCardPatchRequest"
            examples:
              blendedMode:
                summary: Switch to blended rate mode
                value:
                  rateCard:
                    mode: "blended"
                    blendedRate: 150.00
                    defaultMarginPct: 0.20
                    currency: "USD"
                    discounts: []
              byRoleMode:
                summary: Configure by-role rates with a discount
                value:
                  rateCard:
                    mode: "by_role"
                    blendedRate: null
                    roles:
                      - name: "Senior Engineer"
                        unit: "hour"
                        rate: 195.00
                      - name: "Business Analyst"
                        unit: "hour"
                        rate: 145.00
                    defaultMarginPct: 0.25
                    currency: "USD"
                    discounts:
                      - name: "Government discount"
                        type: "percentage"
                        value: 0.05
                        appliesTo: "total"
                        customerIds: ["cust_gov_001", "cust_gov_002"]
                  proposalDefaults:
                    pricingModel: "time_and_materials"
                    paymentTermsDays: 30
                    warrantyPeriodDays: 90
      responses:
        "200":
          description: Rate card saved successfully. Returns the full updated state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCardResponse"
              example:
                success: true
                data:
                  rateCard:
                    mode: "blended"
                    blendedRate: 150.00
                    roles: []
                    defaultMarginPct: 0.20
                    currency: "USD"
                    discounts: []
                  proposalDefaults:
                    pricingModel: "fixed_price"
                    paymentTermsDays: 45
                    warrantyPeriodDays: 60
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # =========================================================================
  # Company Profile
  # =========================================================================

  /settings/company-profile:

    get:
      operationId: getCompanyProfile
      summary: Retrieve organization company profile
      description: |
        Returns the authenticated organization's company profile text. Returns
        `{ success: true, data: { profileText: null } }` when no profile has been saved.
        Accessible by any authenticated organization member.
      tags: [Company Profile]
      responses:
        "200":
          description: |
            Company profile retrieved successfully. `data.profileText` is `null` when
            the organization has not yet saved a profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileResponse"
              examples:
                configured:
                  summary: Organization with a company profile saved
                  value:
                    success: true
                    data:
                      profileText: "## Acme Solutions\n\nWe deliver **enterprise-grade** software for regulated industries.\n\n- 20 years of experience\n- ISO 27001 certified"
                unconfigured:
                  summary: Organization with no profile saved
                  value:
                    success: true
                    data:
                      profileText: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: upsertCompanyProfile
      summary: Upsert organization company profile
      description: |
        Creates or replaces the authenticated organization's company profile text.
        The supplied `profileText` fully replaces any existing text (not a partial
        merge). Requires admin role within the organization.

        Supports markdown formatting. Unicode characters are preserved verbatim.
        Content must be at least 1 character when the intent is to set a profile.
      tags: [Company Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfilePatchRequest"
            example:
              profileText: "## Acme Solutions\n\nWe deliver **enterprise-grade** software for regulated industries.\n\n- 20 years of experience\n- ISO 27001 certified\n- Offices in New York, London, and Singapore"
      responses:
        "200":
          description: Company profile saved successfully. Returns the saved state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileResponse"
              example:
                success: true
                data:
                  profileText: "## Acme Solutions\n\nWe deliver **enterprise-grade** software for regulated industries."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # =========================================================================
  # Proposal Templates — Collection
  # =========================================================================

  /settings/proposal-templates:

    get:
      operationId: listProposalTemplates
      summary: List all proposal templates for the organization
      description: |
        Returns all proposal templates belonging to the authenticated organization,
        ordered by `sortOrder` ascending. An empty array is returned when no templates
        exist. Accessible by any authenticated organization member.

        Optional query parameters narrow the result set for display or filtering
        purposes. Both filters are applied with AND logic when both are present.
      tags: [Proposal Templates]
      parameters:
        - name: section
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TemplateSection"
          description: |
            Filter to templates in this section only.
          example: "payment_terms"
        - name: isRequired
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Filter to required (`true`) or situational/optional (`false`) templates only.
          example: true
        - name: rfpType
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter to templates whose `triggerRfpTypes` array includes this value,
            OR whose `triggerRfpTypes` is `null` (universal). Used by the pipeline
            to retrieve applicable situational templates for a given RFP type.
          example: "technical"
        - name: industryTag
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter to templates whose `triggerIndustryTags` array includes this value,
            OR whose `triggerIndustryTags` is `null`. Used by the pipeline alongside
            `rfpType`.
          example: "government"
      responses:
        "200":
          description: Template list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalTemplateListResponse"
              examples:
                populated:
                  summary: Organization with templates
                  value:
                    success: true
                    data:
                      templates:
                        - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                          organizationId: "org_2abc123def456"
                          section: "assumptions"
                          title: "Standard Project Assumptions"
                          content: "This proposal assumes the client will provide timely access to key stakeholders..."
                          isRequired: true
                          triggerRfpTypes: null
                          triggerIndustryTags: null
                          evaluateCoverage: false
                          sortOrder: 1
                          createdBy: "user_2xyz789abc"
                          createdAt: "2026-02-25T14:30:00Z"
                          updatedAt: "2026-02-25T14:30:00Z"
                empty:
                  summary: Organization with no templates
                  value:
                    success: true
                    data:
                      templates: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createProposalTemplate
      summary: Create a new proposal template
      description: |
        Creates a new contract clause template for the authenticated organization.
        Requires admin role within the organization.

        The server assigns `id`, `organizationId`, `createdBy`, `createdAt`, and
        `updatedAt`. When `isRequired` is `true`, the server coerces `evaluateCoverage`
        to `false` regardless of the submitted value — this is not a validation error.
      tags: [Proposal Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalTemplateCreateRequest"
            examples:
              requiredClause:
                summary: A required clause (no coverage evaluation)
                value:
                  section: "force_majeure"
                  title: "Force Majeure Clause"
                  content: "Neither party shall be liable for any delay or failure to perform obligations due to circumstances beyond the party's reasonable control..."
                  isRequired: true
                  triggerRfpTypes: null
                  triggerIndustryTags: null
                  evaluateCoverage: false
                  sortOrder: 100
              situationalClause:
                summary: A situational clause triggered by RFP type
                value:
                  section: "ip_ownership"
                  title: "Federal IP Ownership Terms"
                  content: "All intellectual property developed under this contract shall remain the property of the client in accordance with FAR 52.227-14..."
                  isRequired: false
                  triggerRfpTypes: ["federal", "government"]
                  triggerIndustryTags: ["public_sector"]
                  evaluateCoverage: true
                  sortOrder: 50
      responses:
        "201":
          description: Template created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalTemplateSingleResponse"
              example:
                success: true
                data:
                  template:
                    id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                    organizationId: "org_2abc123def456"
                    section: "force_majeure"
                    title: "Force Majeure Clause"
                    content: "Neither party shall be liable for any delay or failure to perform obligations due to circumstances beyond the party's reasonable control..."
                    isRequired: true
                    triggerRfpTypes: null
                    triggerIndustryTags: null
                    evaluateCoverage: false
                    sortOrder: 100
                    createdBy: "user_2xyz789abc"
                    createdAt: "2026-02-25T16:00:00Z"
                    updatedAt: "2026-02-25T16:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # =========================================================================
  # Proposal Templates — Single resource
  # =========================================================================

  /settings/proposal-templates/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID of the proposal template.
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    get:
      operationId: getProposalTemplate
      summary: Retrieve a single proposal template
      description: |
        Returns the full detail of a single proposal template. Returns 404 when the
        template ID does not exist or is not owned by the authenticated organization
        (intentionally indistinguishable). Accessible by any authenticated organization
        member.
      tags: [Proposal Templates]
      responses:
        "200":
          description: Template retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalTemplateSingleResponse"
              example:
                success: true
                data:
                  template:
                    id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    organizationId: "org_2abc123def456"
                    section: "payment_terms"
                    title: "Standard Payment Terms"
                    content: "Payment is due **Net 30** from the date of invoice. Late payments accrue interest at 1.5% per month."
                    isRequired: false
                    triggerRfpTypes: null
                    triggerIndustryTags: null
                    evaluateCoverage: true
                    sortOrder: 10
                    createdBy: "user_2xyz789abc"
                    createdAt: "2026-02-25T14:30:00Z"
                    updatedAt: "2026-02-25T15:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: updateProposalTemplate
      summary: Partially update a proposal template
      description: |
        Updates one or more fields on an existing proposal template. All request body
        fields are optional — omitted fields retain their current values. Requires admin
        role within the organization.

        **Constraint enforcement on update**: If either the stored `isRequired` or the
        patched `isRequired` resolves to `true` after the update, `evaluateCoverage` is
        coerced to `false` regardless of what was submitted. This is applied silently —
        it is not a validation error.

        Returns 404 when the template ID does not exist or is not owned by the
        authenticated organization.
      tags: [Proposal Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalTemplatePatchRequest"
            examples:
              updateTitle:
                summary: Update only the title
                value:
                  title: "Revised Payment Terms"
              reorderAndRetrigger:
                summary: Change sort order and add trigger conditions
                value:
                  sortOrder: 5
                  triggerRfpTypes: ["technical"]
                  evaluateCoverage: true
      responses:
        "200":
          description: Template updated successfully. Returns the full updated template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalTemplateSingleResponse"
              example:
                success: true
                data:
                  template:
                    id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    organizationId: "org_2abc123def456"
                    section: "payment_terms"
                    title: "Revised Payment Terms"
                    content: "Payment is due **Net 30** from the date of invoice."
                    isRequired: false
                    triggerRfpTypes: ["technical"]
                    triggerIndustryTags: null
                    evaluateCoverage: true
                    sortOrder: 5
                    createdBy: "user_2xyz789abc"
                    createdAt: "2026-02-25T14:30:00Z"
                    updatedAt: "2026-02-25T17:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteProposalTemplate
      summary: Delete a proposal template
      description: |
        Permanently deletes a proposal template. This action is irreversible. Requires
        admin role within the organization.

        Returns 404 when the template ID does not exist or is not owned by the
        authenticated organization.

        Returns 200 with `{ success: true }` on success. No content is returned in
        the data envelope because there is nothing to return after deletion. (204 is
        avoided to maintain the uniform JSON envelope convention used across all routes.)
      tags: [Proposal Templates]
      responses:
        "200":
          description: Template deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # =========================================================================
  # Proposal Templates — Bulk reorder
  # =========================================================================

  /settings/proposal-templates/reorder:

    post:
      operationId: reorderProposalTemplates
      summary: Bulk update sort order for multiple templates
      description: |
        Updates the `sortOrder` of multiple templates in a single atomic operation.
        Only the templates listed in the request body are updated; all others retain
        their existing sort order. Requires admin role within the organization.

        All template IDs in the request must belong to the authenticated organization.
        Any unrecognized or cross-organization template ID causes a 422 — no partial
        updates are applied.

        Sort order values in the request need not be contiguous and need not cover all
        templates for the organization. Values are stored exactly as provided.
      tags: [Proposal Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
            example:
              items:
                - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  sortOrder: 1
                - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                  sortOrder: 2
                - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                  sortOrder: 3
      responses:
        "200":
          description: Sort order updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderResponse"
              example:
                success: true
                data:
                  updated: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            One or more template IDs in the request do not exist or are not owned by
            the authenticated organization. No updates are applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                success: false
                error: "Validation failed"
                fields:
                  "items[1].id": ["Template not found or does not belong to this organization"]
        "500":
          $ref: "#/components/responses/InternalServerError"
